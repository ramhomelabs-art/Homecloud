version: '3.8'

services:
  # NexaDisk Master Storage Server & Web UI
  nexadisk-master:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexadisk-master
    restart: always
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - HOST=0.0.0.0
      - JWT_SECRET=${JWT_SECRET:-change_this_to_a_random_32_byte_secret_in_prod}
      - AGENT_KEY=${AGENT_KEY:-change_this_agent_key_in_prod}
      - HMAC_ENCRYPTION_SECRET=${HMAC_ENCRYPTION_SECRET:-change_this_hmac_secret_in_prod}
      - DATABASE_URL=postgres://nexadisk:nexadisk_secret_pass@postgres:5432/nexadisk_db
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=nexadisk_db
      - DB_USER=nexadisk
      - DB_PASSWORD=nexadisk_secret_pass
      - STORAGE_ROOT=/var/lib/nexadisk/storage
      - TRASH_STORAGE_ROOT=/var/lib/nexadisk/trash
    volumes:
      - nexadisk-data:/var/lib/nexadisk/storage
      - nexadisk-trash:/var/lib/nexadisk/trash
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nexadisk-net

  # PostgreSQL 16 High-Performance Database
  postgres:
    image: postgres:16-alpine
    container_name: nexadisk-postgres
    restart: always
    environment:
      - POSTGRES_DB=nexadisk_db
      - POSTGRES_USER=nexadisk
      - POSTGRES_PASSWORD=nexadisk_secret_pass
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexadisk -d nexadisk_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - nexadisk-net

  # Redis In-Memory Cache (for high-speed token & lock management)
  redis:
    image: redis:7-alpine
    container_name: nexadisk-redis
    restart: always
    volumes:
      - redis-data:/data
    networks:
      - nexadisk-net

volumes:
  nexadisk-data:
  nexadisk-trash:
  postgres-data:
  redis-data:

networks:
  nexadisk-net:
    driver: bridge
