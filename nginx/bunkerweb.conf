# 🛡️ NexaDisk Enterprise — Custom BunkerWeb / Nginx Streaming & SSE Proxy Rules
# Location: /etc/bunkerweb/custom-configs/nexadisk-stream.conf

# Disable buffering for Server-Sent Events (SSE) and Live Telemetry
location /api/v1/security/events/live {
    proxy_pass http://nexadisk-master:5000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    # Critical SSE Streaming Settings
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
    chunked_transfer_encoding on;
}

# WebSocket proxying for fleet agents & live notifications
location /ws {
    proxy_pass http://nexadisk-master:5000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
}

# Large file upload & streaming endpoint overrides
location /api/v1/upload {
    proxy_pass http://nexadisk-master:5000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    client_max_body_size 50G;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
}
